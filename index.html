<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus — Workout &amp; Fitness Tracker</title>
<meta name="description" content="Private, offline workout and fitness tracker. Your data never leaves this device.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Cg transform='translate(4 4)' fill='%23fff'%3E%3Crect x='2.5' y='8.5' width='3.4' height='7' rx='1.2'/%3E%3Crect x='18.1' y='8.5' width='3.4' height='7' rx='1.2'/%3E%3Crect x='7' y='6.5' width='3' height='11' rx='1.2'/%3E%3Crect x='14' y='6.5' width='3' height='11' rx='1.2'/%3E%3Crect x='8.5' y='10.6' width='7' height='2.8' rx='1.4'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="app/app.css">
</head>
<body data-theme="dark">
<div class="app">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="28" height="28"><rect x="2.5" y="8.5" width="3.4" height="7" rx="1.2" fill="currentColor"/><rect x="18.1" y="8.5" width="3.4" height="7" rx="1.2" fill="currentColor"/><rect x="7" y="6.5" width="3" height="11" rx="1.2" fill="currentColor"/><rect x="14" y="6.5" width="3" height="11" rx="1.2" fill="currentColor"/><rect x="8.5" y="10.6" width="7" height="2.8" rx="1.4" fill="currentColor"/></svg>
      </span>
      <div class="brand-text">
        <strong>Focus</strong>
        <span>Fitness tracker</span>
      </div>
    </div>

    <nav class="nav" aria-label="Main navigation">
      <button class="nav-item is-active" data-view="dashboard">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h4l2-6 4 12 2-6h6"/></svg>
        <span>Dashboard</span>
      </button>
      <button class="nav-item" data-view="calendar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span>Calendar</span>
      </button>
      <button class="nav-item" data-view="progress">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>Progress</span>
      </button>
      <button class="nav-item" data-view="analytics">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>Analytics</span>
      </button>
      <button class="nav-item" data-view="data">
        <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"/></svg>
        <span>Data</span>
      </button>
      <div class="nav-spacer"></div>
      <button class="nav-item" data-view="tools">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.4"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
        <span>Tools</span>
      </button>
      <button class="nav-item" data-view="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Settings</span>
      </button>
    </nav>

    <div class="sidebar-foot">
      <button class="icon-btn" id="themeToggle" title="Toggle dark / light mode" aria-label="Toggle dark / light mode">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="page-title" id="pageTitle">Dashboard</h1>
        <p class="page-subtitle" id="pageSubtitle">Your year at a glance</p>
      </div>
      <div class="topbar-right">
        <div class="year-picker" role="group" aria-label="Select year">
          <button class="icon-btn" id="yearPrev" title="Previous year" aria-label="Previous year">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <select id="yearSelect" class="year-select" aria-label="Select year"></select>
          <button class="icon-btn" id="yearNext" title="Next year" aria-label="Next year">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>
        <button class="btn btn-primary" id="quickAddBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>Add Workout</span>
        </button>
      </div>
    </header>

    <!-- Dashboard -->
    <section class="view" id="view-dashboard" hidden>
      <div class="dash-greeting" id="dashGreeting"></div>
      <div id="dashGrid"></div>
    </section>

    <!-- Calendar -->
    <section class="view" id="view-calendar" hidden>
      <div class="cal-toolbar">
        <div class="seg" id="calModeSeg" role="group" aria-label="Calendar mode">
          <button class="seg-btn is-active" data-cal-mode="year">Year</button>
          <button class="seg-btn" data-cal-mode="month">Month</button>
        </div>
        <div class="legend" id="calLegend"></div>
      </div>
      <div id="calendarBody"></div>
    </section>

    <!-- Tools -->
    <section class="view" id="view-tools" hidden>
      <div id="toolsBody"></div>
    </section>

    <!-- Progress -->
    <section class="view" id="view-progress" hidden>
      <div class="progress-head" id="progressHead"></div>
      <div class="grid-2">
        <div id="progressChartCard"></div>
        <div id="progressStatsCard"></div>
      </div>
      <div id="progressTable"></div>
    </section>

    <!-- Analytics -->
    <section class="view" id="view-analytics" hidden>
      <div class="analytics-compare" id="analyticsCompare"></div>
      <div id="analyticsCharts"></div>
    </section>

    <!-- Data -->
    <section class="view" id="view-data" hidden>
      <div id="dataBody"></div>
    </section>

    <!-- Settings -->
    <section class="view" id="view-settings" hidden>
      <div id="settingsBody"></div>
    </section>
  </main>
</div>

<!-- ============ MODALS & TOASTS ============ -->
<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div>
</div>
<div class="toast-region" id="toastRegion" aria-live="polite"></div>
<div class="tooltip" id="chartTooltip" hidden></div>

<script src="app/xlsx.full.min.js"></script>
<script src="app/seed-data.js"></script>
<script src="app/store.js"></script>
<script src="app/stats.js"></script>
<script src="app/charts.js"></script>
<script src="app/excel.js"></script>
<script src="app/ui.js"></script>
<script src="app/app.js"></script>
</body>
</html>
