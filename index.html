<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse — Workout &amp; Fitness Tracker</title>
<meta name="description" content="Private, offline workout and fitness tracker. Your data never leaves this device.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Cpath d='M16 6c2.2 3.4 5 5.6 5 9a5 5 0 1 1-10 0c0-3.4 2.8-5.6 5-9z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-theme="dark">
<div class="app">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="30" height="30"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M16 6c2.2 3.4 5 5.6 5 9a5 5 0 1 1-10 0c0-3.4 2.8-5.6 5-9z" fill="#fff"/></svg>
      </span>
      <div class="brand-text">
        <strong>Pulse</strong>
        <span>Fitness tracker</span>
      </div>
    </div>

    <nav class="nav" aria-label="Main navigation">
      <button class="nav-item is-active" data-view="dashboard">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h4l2-6 4 12 2-6h6"/></svg>
        <span>Dashboard</span>
      </button>
      <button class="nav-item" data-view="calendar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span>Calendar</span>
      </button>
      <button class="nav-item" data-view="workouts">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M6.5 17.5l11-11"/><circle cx="5" cy="5" r="2.5"/><circle cx="19" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/></svg>
        <span>Workouts</span>
      </button>
      <button class="nav-item" data-view="progress">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>Progress</span>
      </button>
      <button class="nav-item" data-view="analytics">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>Analytics</span>
      </button>
      <button class="nav-item" data-view="data">
        <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"/></svg>
        <span>Data</span>
      </button>
    </nav>

    <div class="sidebar-foot">
      <button class="icon-btn" id="themeToggle" title="Toggle dark / light mode" aria-label="Toggle dark / light mode">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <span class="offline-badge" title="100% local — no internet required">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a15.3 15.3 0 0 0-5.2 1.2M5 5a12 12 0 0 0-3 8M12 8a12 12 0 0 0-8.5 3.5M8.5 16.5A8 8 0 0 1 12 15.5M12 22a8 8 0 0 0 4.5-1.4M17 17a8 8 0 0 0 3-3M2 2l20 20"/></svg>
        Local only
      </span>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="page-title" id="pageTitle">Dashboard</h1>
        <p class="page-subtitle" id="pageSubtitle">Your year at a glance</p>
      </div>
      <div class="topbar-right">
        <div class="year-picker" role="group" aria-label="Select year">
          <button class="icon-btn" id="yearPrev" title="Previous year" aria-label="Previous year">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <select id="yearSelect" class="year-select" aria-label="Select year"></select>
          <button class="icon-btn" id="yearNext" title="Next year" aria-label="Next year">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>
        <button class="btn btn-primary" id="quickAddBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>Add Workout</span>
        </button>
      </div>
    </header>

    <!-- Dashboard -->
    <section class="view" id="view-dashboard" hidden>
      <div class="dash-greeting" id="dashGreeting"></div>
      <div class="grid" id="dashGrid"></div>
    </section>

    <!-- Calendar -->
    <section class="view" id="view-calendar" hidden>
      <div class="cal-toolbar">
        <div class="seg" id="calModeSeg" role="group" aria-label="Calendar mode">
          <button class="seg-btn is-active" data-cal-mode="year">Year</button>
          <button class="seg-btn" data-cal-mode="month">Month</button>
        </div>
        <div class="legend" id="calLegend"></div>
      </div>
      <div id="calendarBody"></div>
    </section>

    <!-- Workouts -->
    <section class="view" id="view-workouts" hidden>
      <div class="filters" id="workoutFilters"></div>
      <div id="workoutList"></div>
    </section>

    <!-- Progress -->
    <section class="view" id="view-progress" hidden>
      <div class="progress-head" id="progressHead"></div>
      <div class="grid-2">
        <div id="progressChartCard"></div>
        <div id="progressStatsCard"></div>
      </div>
      <div id="progressTable"></div>
    </section>

    <!-- Analytics -->
    <section class="view" id="view-analytics" hidden>
      <div class="analytics-compare" id="analyticsCompare"></div>
      <div id="analyticsCharts"></div>
    </section>

    <!-- Data -->
    <section class="view" id="view-data" hidden>
      <div id="dataBody"></div>
    </section>
  </main>
</div>

<!-- ============ MODALS & TOASTS ============ -->
<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div>
</div>
<div class="toast-region" id="toastRegion" aria-live="polite"></div>
<div class="tooltip" id="chartTooltip" hidden></div>

<script src="assets/xlsx.full.min.js"></script>
<script src="js/seed-data.js"></script>
<script src="js/store.js"></script>
<script src="js/stats.js"></script>
<script src="js/charts.js"></script>
<script src="js/excel.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
